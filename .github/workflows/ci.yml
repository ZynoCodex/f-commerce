name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Archive and restore commit the record change and its audit entry in one
      # MongoDB transaction (spec 0005), so the database must run as a replica
      # set, exactly like local development in docker-compose.yml. Transactions
      # are not available on a standalone server.
      - name: Start MongoDB as a single node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" > /dev/null 2>&1; do
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          until [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null)" = "true" ]; do
            sleep 1
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build contracts
        run: npm run build --workspace @f-commerce/contracts
      - name: Start backend
        env:
          NODE_ENV: test
          PORT: 4000
          MONGODB_URI: mongodb://127.0.0.1:27017/f-commerce-e2e
          CORS_ORIGINS: http://localhost:3000
        run: npm run dev --workspace @f-commerce/backend > backend.log 2>&1 &
      - name: Wait for backend and database
        run: |
          for i in $(seq 1 60); do
            if grep -q "Database connected successfully" backend.log 2>/dev/null; then
              curl --fail --silent http://127.0.0.1:4000/health > /dev/null && exit 0
            fi
            if grep -q "Failed to connect to database" backend.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
      - name: Show backend log
        if: always()
        run: cat backend.log || true
      - run: npm run build
