name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # Archive and restore commit the record change and its audit entry in one
      # PostgreSQL transaction (spec 0005), so the tests run against a real
      # server: transaction rollback, partial indexes, and expression indexes
      # all have to behave exactly like they do in production.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=f-commerce \
            -p 5432:5432 postgres:18
          until docker exec postgres pg_isready -U postgres -d f-commerce > /dev/null 2>&1; do
            sleep 1
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/f-commerce
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build contracts
        run: npm run build --workspace @f-commerce/contracts
      - name: Migrate database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/f-commerce
        run: npm run db:migrate --workspace @f-commerce/backend
      - name: Start backend
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/f-commerce
          CORS_ORIGINS: http://localhost:3000
        run: npm run dev --workspace @f-commerce/backend > backend.log 2>&1 &
      - name: Wait for backend and database
        run: |
          for i in $(seq 1 60); do
            if grep -q "Database connected successfully" backend.log 2>/dev/null &&
              grep -q "Backend listening on port" backend.log 2>/dev/null; then
              curl --fail --silent http://127.0.0.1:4000/health > /dev/null && exit 0
            fi
            if grep -q "Failed to connect to database" backend.log 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Run Playwright tests
        run: cd frontend && npx playwright test
      - name: Show backend log
        if: always()
        run: cat backend.log || true
      - run: npm run build
        env:
          API_ORIGIN: http://localhost:4000
